# 自動テスト: Windows・macOS・Linux で、音を出さずにテストを回す。
#
# - 音は出さない（AUDIOSPACE_SILENT=1。出力デバイスを開かない）
# - 画面のテスト（GUI構成と、英語の表示に日本語が残っていないかの確かめ）は
#   Windows だけで回す。定位確認ツールの利用者は Windows で使っている
# - OS の表示言語の判定を、OS ごとに確かめる（macOS は表示言語を日本語に
#   切り替えても確かめる）
# - 結果のファイル（tests/*_result.txt）は、失敗しても成功しても
#   Artifacts に置く（1件ずつの合否を読める）

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        # 対応する最も古い版（pyproject.toml の requires-python）と、新しい版
        python: ["3.10", "3.13"]
    env:
      AUDIOSPACE_SILENT: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install audiospace and the optional packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"

      - name: Install wxPython (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install wxPython

      - name: Language detection (Windows)
        if: runner.os == 'Windows'
        run: python -X utf8 tests/check_language.py --expect en

      - name: Language detection (macOS, English and then Japanese)
        if: runner.os == 'macOS'
        run: |
          defaults read -g AppleLanguages || true
          python -X utf8 tests/check_language.py --expect en
          defaults write -g AppleLanguages -array ja-JP en-US
          python -X utf8 tests/check_language.py --expect ja
          defaults delete -g AppleLanguages || true

      - name: Language detection (Linux)
        if: runner.os == 'Linux'
        run: |
          LC_ALL= LC_MESSAGES= LANG=C.UTF-8 python -X utf8 tests/check_language.py --expect en
          LC_ALL= LC_MESSAGES= LANG=ja_JP.UTF-8 python -X utf8 tests/check_language.py --expect ja

      - name: Tests (all suites)
        if: runner.os == 'Windows'
        run: python -X utf8 tests/run_all.py

      - name: Tests (without the GUI suite)
        if: runner.os != 'Windows'
        run: python -X utf8 tests/run_all.py --skip-gui

      - name: English text check
        if: runner.os == 'Windows'
        run: python -X utf8 tests/en_probe.py

      - name: Keep the result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-python${{ matrix.python }}
          path: tests/*_result.txt
          if-no-files-found: warn
